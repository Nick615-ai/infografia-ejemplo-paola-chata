<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista Interactiva</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      padding: 20px;
    }

    .interactive-list {
      list-style: none;
      padding: 0;
    }

    .item-wrapper {
      display: flex;
      gap: 15px;
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      transition: 0.3s;
    }

    .item-wrapper:hover {
      transform: translateX(5px);
    }

    .icon-container {
      width: 50px;
      height: 50px;
      background: orange;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Lista Interactiva</h1>

  <ul class="interactive-list">
    <li class="list-item">
      <div class="item-wrapper">
        <div class="icon-container">1</div>
        <div>
          <h3 class="item-title">Elemento 1</h3>
          <p class="item-desc">Descripción del elemento.</p>
        </div>
      </div>
    </li>

    <li class="list-item">
      <div class="item-wrapper">
        <div class="icon-container">2</div>
        <div>
          <h3 class="item-title">Elemento 2</h3>
          <p class="item-desc">Otra descripción.</p>
        </div>
      </div>
    </li>
  </ul>

</body>
</html>
